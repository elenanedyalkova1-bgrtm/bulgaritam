name: Publish public Bulgaritam site

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Build only, or build and publish to SuperHosting
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - deploy

concurrency:
  group: bulgaritam-public-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build and verify static site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact-name: ${{ steps.manifest.outputs.artifact-name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install public-site dependencies
        run: npm ci

      - name: Check Product and image health
        run: npm run health:products -- --report=/tmp/product-health-report.json
        env:
          BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
          BASEROW_TABLE_ID: ${{ vars.BASEROW_TABLE_ID }}

      - name: Store Product health report
        uses: actions/upload-artifact@v6
        with:
          name: product-health-report-${{ github.run_id }}
          path: /tmp/product-health-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Build latest Baserow catalog
        run: npm run build
        env:
          BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
          BASEROW_TABLE_ID: ${{ vars.BASEROW_TABLE_ID }}
          BASEROW_BRANDS_TABLE_ID: ${{ vars.BASEROW_BRANDS_TABLE_ID }}
          BASEROW_SITE_SETTINGS_TABLE_ID: ${{ vars.BASEROW_SITE_SETTINGS_TABLE_ID }}
          PUBLIC_ANALYTICS_ENDPOINT: https://admin.bulgaritam.bg/api/events/
          PRODUCT_HEALTH_REPORT_PATH: /tmp/product-health-report.json

      - name: Verify generated pages and stale routes
        id: manifest
        run: |
          node scripts/verify-public-build.mjs
          echo "artifact-name=bulgaritam-public-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
        env:
          BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
          BASEROW_TABLE_ID: ${{ vars.BASEROW_TABLE_ID }}
          BASEROW_BRANDS_TABLE_ID: ${{ vars.BASEROW_BRANDS_TABLE_ID }}
          BASEROW_SITE_SETTINGS_TABLE_ID: ${{ vars.BASEROW_SITE_SETTINGS_TABLE_ID }}
          BUILD_COMMIT_SHA: ${{ github.sha }}
          PRODUCT_HEALTH_REPORT_PATH: /tmp/product-health-report.json

      - name: Upload verified static artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.manifest.outputs.artifact-name }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  deploy-superhosting:
    name: Publish verified artifact to SuperHosting
    if: ${{ github.event_name == 'push' || inputs.mode == 'deploy' }}
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: public-production
    steps:
      - name: Download verified artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build-and-verify.outputs.artifact-name }}
          path: dist

      - name: Validate restricted FTPS configuration
        env:
          FTPS_SERVER_IP: ${{ vars.SUPERHOSTING_FTPS_SERVER_IP }}
          FTPS_TLS_HOST: ${{ vars.SUPERHOSTING_FTPS_TLS_HOST }}
          FTPS_PORT: ${{ vars.SUPERHOSTING_FTPS_PORT }}
          FTPS_USERNAME: ${{ secrets.SUPERHOSTING_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.SUPERHOSTING_FTPS_PASSWORD }}
        run: |
          test -n "$FTPS_SERVER_IP"
          test -n "$FTPS_TLS_HOST"
          test "$FTPS_PORT" = "21"
          test -n "$FTPS_USERNAME"
          test -n "$FTPS_PASSWORD"
          case "$FTPS_TLS_HOST" in *.superhosting.bg) ;; *) echo "FTPS TLS hostname must be a SuperHosting hostname" >&2; exit 1;; esac
          test -f dist/index.html
          test -f dist/deploy-manifest.json
          test -f dist/.htaccess

      - name: Prepare secure FTPS client
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Map the verified certificate hostname
        env:
          FTPS_SERVER_IP: ${{ vars.SUPERHOSTING_FTPS_SERVER_IP }}
          FTPS_TLS_HOST: ${{ vars.SUPERHOSTING_FTPS_TLS_HOST }}
        run: echo "$FTPS_SERVER_IP $FTPS_TLS_HOST" | sudo tee -a /etc/hosts > /dev/null

      - name: Upload site over strict FTPS and remove stale Product/Brand pages
        env:
          FTPS_TLS_HOST: ${{ vars.SUPERHOSTING_FTPS_TLS_HOST }}
          FTPS_PORT: ${{ vars.SUPERHOSTING_FTPS_PORT }}
          FTPS_USERNAME: ${{ secrets.SUPERHOSTING_FTPS_USERNAME }}
          FTPS_PASSWORD: ${{ secrets.SUPERHOSTING_FTPS_PASSWORD }}
        run: |
          lftp -u "$FTPS_USERNAME","$FTPS_PASSWORD" -p "$FTPS_PORT" "ftp://$FTPS_TLS_HOST" <<LFTP
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate true
          set ssl:check-hostname true
          cd /
          mirror --reverse --verbose --exclude-glob 'p/**' --exclude-glob 'brand/**' dist/ /
          mirror --reverse --delete --verbose dist/p/ /p/
          mirror --reverse --delete --verbose dist/brand/ /brand/
          get /.htaccess -o /tmp/live-htaccess
          bye
          LFTP

      - name: Confirm protected hosting file remains present
        run: test -s /tmp/live-htaccess

      - name: Verify public origin
        run: |
          curl --fail --silent --show-error --retry 3 https://bulgaritam.bg/ > /tmp/live-index.html
          curl --fail --silent --show-error --retry 3 https://bulgaritam.bg/deploy-manifest.json > /tmp/live-manifest.json
          node -e 'const fs=require("fs"),crypto=require("crypto");const m=JSON.parse(fs.readFileSync("/tmp/live-manifest.json","utf8"));const h=crypto.createHash("sha256").update(fs.readFileSync("/tmp/live-index.html")).digest("hex");if(m.commit!==process.env.GITHUB_SHA||m.index_sha256!==h)process.exit(1)'
