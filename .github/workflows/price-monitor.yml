name: Bulgaritam Price Monitor

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run or persist monitoring metadata/history
        required: true
        default: dry-run
        type: choice
        options: [dry-run, write-monitor-results]
      limit:
        description: Optional manual limit; clamped to dynamic bounded capacity
        required: false
      ids:
        description: Optional exact comma-separated product-ID allowlist (manual runs only, max 25)
        required: false
      recovery_ids:
        description: Optional exact bounded recovery allowlist (manual runs only, max 100; mutually exclusive with ids)
        required: false

concurrency:
  # Catalog and external monitoring share Products/Observed Products and the
  # same Price History sheet. Keep every writer in one repository-wide lane.
  group: bulgaritam-monitoring-single-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check due product prices
        env:
          BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
          BASEROW_TABLE_ID: ${{ vars.BASEROW_TABLE_ID }}
          GOOGLE_PRICE_MONITOR_SPREADSHEET_ID: ${{ vars.GOOGLE_PRICE_MONITOR_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'write-monitor-results' || inputs.mode }}
          RUN_LIMIT: ${{ inputs.limit }}
          RUN_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.ids || '' }}
          RUN_RECOVERY_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_ids || '' }}
        run: |
          if [ -n "$RUN_IDS" ] && [ -n "$RUN_RECOVERY_IDS" ]; then
            echo "ids and recovery_ids are mutually exclusive" >&2
            exit 1
          elif [ -n "$RUN_RECOVERY_IDS" ]; then
            args=(recovery-ids "--ids=${RUN_RECOVERY_IDS}" --concurrency=6 --domain-delay-ms=2000 --timeout-ms=15000 --output=/tmp/price-monitor-run.json --audit-snapshot=/tmp/price-monitor-pre-snapshot.json)
          elif [ -n "$RUN_IDS" ]; then
            args=(ids "--ids=${RUN_IDS}" --concurrency=6 --domain-delay-ms=2000 --timeout-ms=15000 --output=/tmp/price-monitor-run.json --audit-snapshot=/tmp/price-monitor-pre-snapshot.json)
          else
            args=(due --concurrency=6 --domain-delay-ms=2000 --timeout-ms=15000 --output=/tmp/price-monitor-run.json)
            if [ -n "$RUN_LIMIT" ]; then args+=("--limit=${RUN_LIMIT}"); fi
          fi
          if [ "$RUN_MODE" = "write-monitor-results" ]; then args+=(--write-monitor-results); fi
          npm run monitor:scheduled -- "${args[@]}"
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: price-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/price-monitor-run.json
            /tmp/price-monitor-pre-snapshot.json
          if-no-files-found: error
          retention-days: 30
