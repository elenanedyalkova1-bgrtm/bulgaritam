name: Publish exact approved Bulgaritam artifact
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify only, or publish the pinned approved artifact (no build)
        required: true
        default: preflight
        type: choice
        options: [preflight, deploy]
permissions:
  contents: read
  actions: read
concurrency:
  group: bulgaritam-public-production
  cancel-in-progress: false
jobs:
  exact-release:
    if: github.ref == 'refs/heads/codex/exact-artifact-release-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: public-production
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: elenanedyalkova1-bgrtm/bulgaritam
      BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
      FTPS_SERVER_IP: ${{ vars.SUPERHOSTING_FTPS_SERVER_IP }}
      FTPS_TLS_HOST: ${{ vars.SUPERHOSTING_FTPS_TLS_HOST }}
      FTPS_PORT: ${{ vars.SUPERHOSTING_FTPS_PORT }}
      FTPS_USERNAME: ${{ secrets.SUPERHOSTING_FTPS_USERNAME }}
      FTPS_PASSWORD: ${{ secrets.SUPERHOSTING_FTPS_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify source scope and pinned artifact identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .exact-release
          test "$(gh api repos/$GH_REPO/git/ref/heads/main --jq .object.sha)" = b629cd7d1a5a30e2efc9063128e773d8e49888da
          git diff --name-only b629cd7d1a5a30e2efc9063128e773d8e49888da HEAD > .exact-release/workflow-changes.txt
          python3 - <<'PY'
          from pathlib import Path
          files=Path('.exact-release/workflow-changes.txt').read_text().splitlines()
          assert files and all(x=='.github/workflows/publish-public.yml' or x.startswith('ops/exact-release-20261029/') for x in files)
          PY
          gh api repos/$GH_REPO/actions/artifacts/12745306313 > .exact-release/artifact-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.exact-release/artifact-metadata.json').read_text())
          assert d['name']=='bulgaritam-public-40527313369-1' and not d['expired']
          assert d['workflow_run']['head_sha']=='b629cd7d1a5a30e2efc9063128e773d8e49888da'
          assert d['workflow_run']['id']==40527313369
          assert d['digest']=='sha256:08bb5ce1eac73faa45cb3873f0d7a8af02d7ee4f2c23a8cb729904cd4d4ea1bf'
          PY
      - name: Download exact release and rollback ZIPs without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/actions/artifacts/12745306313/zip > .exact-release/release.zip
          gh api repos/$GH_REPO/actions/artifacts/12219708574/zip > .exact-release/rollback.zip
          python3 ops/exact-release-20261029/unpack.py
      - name: Install secure FTPS transport
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Map verified TLS hostname and validate configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,ipaddress
          ipaddress.ip_address(os.environ['FTPS_SERVER_IP'])
          h=os.environ['FTPS_TLS_HOST']
          assert h.endswith('.superhosting.bg') and all(x.isalnum() or x in '.-' for x in h)
          assert os.environ['FTPS_PORT']=='21'
          assert os.environ['FTPS_USERNAME'] and os.environ['FTPS_PASSWORD']
          PY
          printf '%s %s\n' "$FTPS_SERVER_IP" "$FTPS_TLS_HOST" | sudo tee -a /etc/hosts > /dev/null
      - name: Verify jailed FTPS root and preserve hosting-owned file (read only)
        run: python3 ops/exact-release-20261029/ftps.py
        env:
          FTPS_PHASE: read-only
      - name: Immediate exact origin, rollback, artifact and inactive-route preflight
        run: node ops/exact-release-20261029/release.mjs preflight
      - name: Assets - first production write
        if: inputs.mode == 'deploy'
        run: python3 ops/exact-release-20261029/ftps.py
        env:
          FTPS_PHASE: assets
      - name: Assets HTTP and SHA barrier
        if: inputs.mode == 'deploy'
        run: node ops/exact-release-20261029/release.mjs assets
      - name: Documents - only after verified assets
        if: inputs.mode == 'deploy'
        run: python3 ops/exact-release-20261029/ftps.py
        env:
          FTPS_PHASE: documents
      - name: Documents HTTP and SHA barrier
        if: inputs.mode == 'deploy'
        run: node ops/exact-release-20261029/release.mjs documents
      - name: Recheck exact inactive records immediately before cleanup
        if: inputs.mode == 'deploy'
        run: node ops/exact-release-20261029/release.mjs stale
      - name: Remove exact 22 stale files, publish manifest and completed state last
        if: inputs.mode == 'deploy'
        run: python3 ops/exact-release-20261029/ftps.py
        env:
          FTPS_PHASE: finalize
      - name: Verify all production file hashes, removed routes and 14 images
        if: inputs.mode == 'deploy'
        run: node ops/exact-release-20261029/release.mjs postflight
      - name: Preserve release evidence even after a failure - no automatic rollback
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exact-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .exact-release/*.json
            .exact-release/*.log
            .exact-release/workflow-changes.txt
            .exact-release/htaccess-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
